[package]
name = "tests"
version = "0.1.0"
description = "SOULBOUND LiteSVM integration suite"
edition = "2021"
rust-version = "1.97.1"

[dependencies]
soulbound = { version = "0.1.0", path = "../programs/soulbound", features = ["no-entrypoint"] }
anchor-lang = "=1.2.1"
mpl-core = { version = "=0.12.1", features = ["borsh-v1"] }
litesvm = "0.18.1"
solana-keypair = "3.1"
solana-pubkey = "3"
solana-signer = "3"
solana-instruction = "3"
solana-transaction = "4"
solana-message = "4"
solana-sdk-ids = "3"
spl-associated-token-account-interface = "2"
spl-token-2022-interface = "3"
borsh = "1"
base64 = "0.22"

[lib]
path = "src/lib.rs"
